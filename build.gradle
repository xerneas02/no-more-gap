plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

loom {
	splitEnvironmentSourceSets()
	mods {
		no_more_gap {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "no-more-gap-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
		clearRunDirectory = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	testImplementation platform('org.junit:junit-bom:6.0.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
	gametestImplementation platform('org.junit:junit-bom:6.0.3')
	gametestImplementation 'org.junit.jupiter:junit-jupiter'
	gametestImplementation fabricApi.module("fabric-gametest-api-v1", "${fabric_api_version}")
}

processResources {
	inputs.properties version: version, minecraft_version: minecraft_version, fabric_api_version: fabric_api_version, java_version: java_version
	filesMatching('fabric.mod.json') { expand version: version, minecraft_version: minecraft_version, fabric_api_version: fabric_api_version, java_version: java_version }
}

tasks.withType(JavaCompile).configureEach {
	options.release = Integer.parseInt(project.java_version)
	options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

def supportedMinecraftVersions = [
	'26.1'  : '0.145.1+26.1',
	'26.1.1': '0.145.4+26.1.1',
	'26.1.2': '0.155.2+26.1.2',
	'26.2'  : '0.152.2+26.2'
]

// CI runs on Linux; keep the version-matrix tasks portable instead of Windows-only.
def gradleWrapper = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : './gradlew'

def versionBuildTasks = supportedMinecraftVersions.collect { minecraftVersion, fabricApiVersion ->
	tasks.register("buildMinecraft${minecraftVersion.replace('.', '_')}", Exec) {
		group = 'build'
		description = "Builds No More Gap for Minecraft ${minecraftVersion}."
		workingDir projectDir
		// Game tests are heavy: they run with `check`/`runGameTest` on the main
		// version only; the version matrix builds unit tests and jars.
		commandLine gradleWrapper, 'build', '-x', 'runGameTest',
			"-Pminecraft_version=${minecraftVersion}",
			"-Pfabric_api_version=${fabricApiVersion}",
			"-Pmod_version=${project.mod_version}+mc${minecraftVersion}",
			"-Parchives_base_name=no-more-gap-${minecraftVersion}"
	}
}

versionBuildTasks.drop(1).eachWithIndex { task, index -> task.configure { mustRunAfter(versionBuildTasks[index]) } }
tasks.register('buildAllVersions') {
	group = 'build'
	description = 'Builds JARs for every supported Minecraft version.'
	dependsOn(versionBuildTasks)
}

def neoForge26Versions = ['26.1', '26.1.1', '26.1.2', '26.2']
def neoForge26Builds = neoForge26Versions.collect { gameVersion ->
    tasks.register("buildNeoForge${gameVersion.replace('.', '_')}", Exec) {
	    group = 'build'
	    description = "Builds the NeoForge port for Minecraft ${gameVersion}."
	    workingDir projectDir
	    commandLine gradleWrapper, '-p', 'versions/neoforge-26.2',
		    "buildMinecraft${gameVersion.replace('.', '_')}", '--console=plain'
    }
}
neoForge26Builds.drop(1).eachWithIndex { task, index -> task.configure { mustRunAfter neoForge26Builds[index] } }
tasks.register('buildAllNeoForge26') {
	group = 'build'
	description = 'Builds every NeoForge 26.x port.'
	dependsOn neoForge26Builds
}

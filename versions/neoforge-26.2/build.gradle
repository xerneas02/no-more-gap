plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = maven_group
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

// Game tests using the NeoForge test framework. Declared before the neoForge
// block so the mod can reference the source set; the production jar keeps
// using the main sources only.
sourceSets {
    gametest {
        java { srcDir 'src/gametest/java' }
        resources { srcDir 'src/gametest/resources' }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        // Vanilla-style game test server, driven by the NeoForge test framework
        // (@ForEachTest + @GameTest). It shuts down after running the tests and
        // fails the build when a required test fails.
        gameTestServer { type = 'gameTestServer' }
    }
    mods {
        no_more_gap {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    unitTest {
        enable()
        testedMod = mods.no_more_gap
    }
}

def fabricOnly = [
        'fr/xerneas02/nomoregap/NoMoreGap.java',
        'fr/xerneas02/nomoregap/config/NoMoreGapConfig.java',
        'fr/xerneas02/nomoregap/lava/LavaLoggingRules.java',
        'fr/xerneas02/nomoregap/network/NoMoreGapNetworking.java',
        'fr/xerneas02/nomoregap/network/MovingPistonNetworking.java',
        'fr/xerneas02/nomoregap/registry/ModBlocks.java',
        'fr/xerneas02/nomoregap/registry/ModItems.java',
        'fr/xerneas02/nomoregap/registry/ModBlockEntities.java',
        'fr/xerneas02/nomoregap/rule/CompositeRules.java',
        'fr/xerneas02/nomoregap/NoMoreGapClient.java',
        'fr/xerneas02/nomoregap/render/CompositeChunkModel.java'
]

sourceSets {
    main {
        java {
            srcDirs '../../src/main/java', '../../src/client/java', 'src/main/java'
            exclude { details ->
                !details.file.toPath().startsWith(project.file('src/main/java').toPath())
                        && fabricOnly.any { details.file.path.replace('\\', '/').endsWith(it) }
            }
        }
        resources {
            srcDirs = ['../../src/main/resources', 'src/main/resources']
            exclude 'fabric.mod.json'
        }
    }
    test {
        java {
            srcDir '../../src/test/java'
            // LoaderEnvironmentTest proves the Fabric Loader + mixins are active
            // in the JUnit JVM; it is Fabric-specific and cannot compile here.
            exclude '**/LoaderEnvironmentTest.java'
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // NeoForge's test framework: @ForEachTest / @GameTest annotations and the
    // game test server run (testLibraries of the NeoForge userdev config).
    testImplementation "net.neoforged:testframework:${neo_version}"
    gametestImplementation "net.neoforged:testframework:${neo_version}"
    // The game test server run loads the test framework as a mod, so it must
    // be on the project runtime classpath.
    implementation "net.neoforged:testframework:${neo_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

processResources {
    inputs.properties minecraft_version: minecraft_version, neo_version: neo_version, mod_version: mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand minecraft_version: minecraft_version, neo_version: neo_version, mod_version: mod_version
    }
}

def neoforge26Versions = [
        '26.1'  : '26.1.0.19-beta',
        '26.1.1': '26.1.1.15-beta',
        '26.1.2': '26.1.2.77',
        '26.2'  : '26.2.0.59'
]

def neoforge26Builds = neoforge26Versions.collect { minecraftVersion, neoVersion ->
    tasks.register("buildMinecraft${minecraftVersion.replace('.', '_')}", Exec) {
        group = 'build'
        description = "Builds the NeoForge port for Minecraft ${minecraftVersion}."
        workingDir projectDir
        commandLine file('../../gradlew.bat'), 'build', '--console=plain',
                "-Pminecraft_version=${minecraftVersion}", "-Pneo_version=${neoVersion}",
                "-Pmod_version=0.1.2+mc${minecraftVersion}",
                "-Parchives_base_name=no-more-gap-neoforge-${minecraftVersion}"
    }
}
neoforge26Builds.drop(1).eachWithIndex { task, index ->
    task.configure { mustRunAfter neoforge26Builds[index] }
}
tasks.register('buildAllMinecraft26') {
    group = 'build'
    description = 'Builds NeoForge JARs for Minecraft 26.1 through 26.2.'
    dependsOn neoforge26Builds
}

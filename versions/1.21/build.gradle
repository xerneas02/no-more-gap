plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${mod_version}+mc${minecraft_version}"
group = maven_group
base.archivesName = archives_base_name

loom {
    splitEnvironmentSourceSets()
    mods {
        no_more_gap {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// The fabric-gametest-api-v1 module can only be resolved through
// fabricApi.module() for recent fabric-api generations (1.21.5+); older
// versions simply build without game tests (the matrix tasks exclude them).
def supportsGameTests = minecraft_version in
        ['1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "no-more-gap-test"
        enableGameTests = supportsGameTests
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

// Share the game test sources and resources with the main branch: the tests
// only rely on the Fabric GameTest annotation and stable Minecraft APIs.
sourceSets.gametest.java.srcDir '../../src/gametest/java'
sourceSets.gametest.resources.srcDir '../../src/gametest/resources'

// Share the unit tests with the main branch as well: the tests only use APIs
// stable across the supported versions (the local copies were removed).
sourceSets.test.java.srcDir '../../src/test/java'
sourceSets.test.java.exclude 'fr/xerneas02/nomoregap/block/entity/CompositeBlockEntityTest.java'

def sharedMain = objects.sourceDirectorySet('sharedMain', 'Shared 1.21-compatible main sources')
sharedMain.srcDir '../../src/main/java'
sharedMain.include([
        'fr/xerneas02/nomoregap/advancement/ModAdvancements.java',
        'fr/xerneas02/nomoregap/config/NoMoreGapConfig.java',
        'fr/xerneas02/nomoregap/geometry/**',
        'fr/xerneas02/nomoregap/interaction/CompositePartUpdater.java',
        'fr/xerneas02/nomoregap/interaction/CompositeUseContext.java',
        'fr/xerneas02/nomoregap/interaction/PartHitResult.java',
        'fr/xerneas02/nomoregap/lava/LavaLogging.java',
        'fr/xerneas02/nomoregap/mixin/BlockTickInvoker.java',
        'fr/xerneas02/nomoregap/mixin/CompositeInteractionSetBlockMixin.java',
        'fr/xerneas02/nomoregap/mixin/CompositeNeighborStateMixin.java',
        'fr/xerneas02/nomoregap/mixin/CompositeScheduledTickMixin.java',
        'fr/xerneas02/nomoregap/mixin/CompositeStairNeighborMixin.java',
        'fr/xerneas02/nomoregap/mixin/CompositeSupportMixin.java',
        'fr/xerneas02/nomoregap/mixin/DoorBlockMixin.java',
        'fr/xerneas02/nomoregap/mixin/DoublePlantBlockMixin.java',
        'fr/xerneas02/nomoregap/mixin/LavaLoggedDefaultStateMixin.java',
        'fr/xerneas02/nomoregap/mixin/LavaLoggedFluidStateMixin.java',
        'fr/xerneas02/nomoregap/mixin/LavaLoggedNeighborTickMixin.java',
        'fr/xerneas02/nomoregap/mixin/LavaLoggingReactionMixin.java',
        'fr/xerneas02/nomoregap/mixin/PlantSupportMixin.java',
        'fr/xerneas02/nomoregap/mixin/WaterloggedStateDefinitionMixin.java',
        'fr/xerneas02/nomoregap/network/payload/**',
        'fr/xerneas02/nomoregap/part/PartContainer.java',
        'fr/xerneas02/nomoregap/part/PartInstance.java',
        'fr/xerneas02/nomoregap/registry/**',
        'fr/xerneas02/nomoregap/renderdata/**',
        'fr/xerneas02/nomoregap/util/**'
])
sourceSets.main.java.source sharedMain

def sharedClient = objects.sourceDirectorySet('sharedClient', 'Shared 1.21-compatible client sources')
sharedClient.srcDir '../../src/client/java'
sharedClient.include 'fr/xerneas02/nomoregap/mixin/client/**'
sourceSets.client.java.source sharedClient

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    // The game test module must be on a remapped (modImplementation) configuration
    // so the run classpath uses project mappings, and it is inherited by the
    // gametest source set through the main source set's classpath.
    if (supportsGameTests) {
        modImplementation fabricApi.module("fabric-gametest-api-v1", "${fabric_api_version}")
    }
    gametestImplementation platform('org.junit:junit-bom:5.11.4')
    gametestImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    inputs.properties version: version, minecraft_version: minecraft_version,
            fabric_api_version: fabric_api_version, java_version: java_version
    filesMatching('fabric.mod.json') {
        expand version: version, minecraft_version: minecraft_version,
                fabric_api_version: fabric_api_version, java_version: java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

if (minecraft_version != '1.21.11') {
    sourceSets.main.java.srcDir 'src/legacy/java'
    sourceSets.main.java.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/main/java/') && details.file.path.replace('\\', '/').matches(
                '.*/(NoMoreGap|CompositeRules|LavaLoggingRules)\\.java')
    }
}

if (!(minecraft_version in ['1.21.9', '1.21.10', '1.21.11'])) {
    sourceSets.client.java.srcDir 'src/legacyClient/java'
    sourceSets.client.java.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/client/java/')
                && details.file.name == 'CompositeBlockEntityRenderer.java'
    }
}

if (minecraft_version == '1.21.5') {
    sourceSets.main.java.srcDir 'src/legacyNbt/java'
    sourceSets.main.java.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/main/java/fr/xerneas02/nomoregap/block/entity/')
                && details.file.name in ['CompositeBlockEntity.java', 'CompositeProxyBlockEntity.java']
    }
}

if (minecraft_version in ['1.21.2', '1.21.3', '1.21.4']) {
    sourceSets.main.java.srcDir 'src/legacyNbtOld/java'
    sourceSets.main.java.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/main/java/fr/xerneas02/nomoregap/block/entity/')
                && details.file.name in ['CompositeBlockEntity.java', 'CompositeProxyBlockEntity.java']
    }
}

if (minecraft_version in ['1.21', '1.21.1']) {
    sourceSets.main.java.srcDir 'src/legacyNbtVeryOld/java'
    sourceSets.main.java.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/main/java/fr/xerneas02/nomoregap/block/entity/')
                && details.file.name in ['CompositeBlockEntity.java', 'CompositeProxyBlockEntity.java']
    }
}

if (minecraft_version in ['1.21', '1.21.1']) {
    sharedMain.exclude([
            'fr/xerneas02/nomoregap/registry/ModBlocks.java',
            'fr/xerneas02/nomoregap/registry/ModItems.java',
            'fr/xerneas02/nomoregap/interaction/CompositePartUpdater.java',
            'fr/xerneas02/nomoregap/mixin/CompositeNeighborStateMixin.java',
            'fr/xerneas02/nomoregap/mixin/CompositeScheduledTickMixin.java',
            'fr/xerneas02/nomoregap/mixin/DoorBlockMixin.java',
            'fr/xerneas02/nomoregap/mixin/LavaLoggedNeighborTickMixin.java',
            'fr/xerneas02/nomoregap/mixin/PlantSupportMixin.java',
            'fr/xerneas02/nomoregap/mixin/LavaLoggingReactionMixin.java'
    ])
    sourceSets.main.java.srcDir 'src/legacyOld/java'
    sourceSets.main.java.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/main/java/') && (
                details.file.name in ['ModBlocks.java', 'ModItems.java', 'CompositeBlock.java',
                        'CompositePartUpdater.java', 'SnowyVegetationFeature.java', 'CompositeNeighborStateMixin.java',
                        'CompositeScheduledTickMixin.java', 'DoorBlockMixin.java', 'LavaLoggedNeighborTickMixin.java',
                        'PlantSupportMixin.java', 'LavaLoggingReactionMixin.java'])
    }
    sourceSets.main.resources.srcDir 'src/legacyOld/resources'
    sourceSets.main.resources.exclude { details ->
        details.file.path.replace('\\', '/').contains('/src/main/resources/') && details.file.name == 'no_more_gap.mixins.json'
    }
}

def minecraft121Versions = [
        '1.21'   : '0.102.0+1.21',
        '1.21.1' : '0.116.15+1.21.1',
        '1.21.2' : '0.106.1+1.21.2',
        '1.21.3' : '0.114.1+1.21.3',
        '1.21.4' : '0.119.4+1.21.4',
        '1.21.5' : '0.128.2+1.21.5',
        '1.21.6' : '0.128.2+1.21.6',
        '1.21.7' : '0.129.0+1.21.7',
        '1.21.8' : '0.136.1+1.21.8',
        '1.21.9' : '0.134.1+1.21.9',
        '1.21.10': '0.138.4+1.21.10',
        '1.21.11': '0.141.6+1.21.11'
]

def minecraft121Builds = minecraft121Versions.collect { gameVersion, apiVersion ->
    tasks.register("buildMinecraft${gameVersion.replace('.', '_')}", Exec) {
        group = 'build'
        workingDir projectDir
        // Game tests are heavy and their shared sources target the modern API:
        // the version matrix builds jars only. Run `check` or
        // `runGameTest` explicitly for the default version to run game tests.
        def wrapper = file(System.getProperty('os.name').toLowerCase().contains('windows') ? '../../gradlew.bat' : '../../gradlew')
        commandLine wrapper, 'assemble',
                "-Pminecraft_version=${gameVersion}", "-Pfabric_api_version=${apiVersion}",
                "-Parchives_base_name=no-more-gap-${gameVersion}", '--console=plain'
    }
}
minecraft121Builds.drop(1).eachWithIndex { task, index ->
    task.configure { mustRunAfter minecraft121Builds[index] }
}
tasks.register('buildAllMinecraft121') {
    group = 'build'
    description = 'Builds No More Gap for Minecraft 1.21 through 1.21.11.'
    dependsOn minecraft121Builds
}
